<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <radialGradient id="cyan-glow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald-glow" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rose-glow" cx="50%" cy="10%" r="35%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear accent gradients -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- Radial Glow Orbs -->
  <rect width="1200" height="420" fill="url(#cyan-glow)"/>
  <rect width="1200" height="420" fill="url(#emerald-glow)"/>
  <rect width="1200" height="420" fill="url(#rose-glow)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Laser Caliper Blueprint Line -->
  <line x1="60" y1="72" x2="1140" y2="72" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="4 6"/>
  <circle cx="60" cy="72" r="3" fill="#38bdf8"/>
  <circle cx="1140" cy="72" r="3" fill="#38bdf8"/>

  <!-- Top Badges Row -->
  <g transform="translate(60, 36)">
    <!-- HackAlem 2026 Badge -->
    <rect x="0" y="0" width="190" height="26" rx="13" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HACKALEM 2026 · ASTANA</text>

    <!-- Swarm Badge -->
    <rect x="202" y="0" width="170" height="26" rx="13" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="214" y="17" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">6 AUTONOMOUS AGENTS</text>

    <!-- Tests Badge -->
    <rect x="384" y="0" width="150" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="396" y="17" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ 25/25 TESTS PASS</text>

    <!-- Skeptic Badge -->
    <rect x="546" y="0" width="195" height="26" rx="13" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="558" y="17" fill="#ffe4e6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">3 SKEPTIC TRAPS BLOCKED</text>

    <!-- Right-aligned Architecture Badge -->
    <rect x="910" y="0" width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="926" y="17" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">ZERO-HALLUCINATION</text>
  </g>

  <!-- Left Content: Logo & Hero Title -->
  <g transform="translate(60, 105)">
    <!-- Logo Icon: Tech Shield & Caliper Laser -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="68" height="68" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="M34 14 L52 22 V38 C52 49 44 57 34 60 C24 57 16 49 16 38 V22 Z" fill="url(#shield-grad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
      <path d="M26 34 L32 40 L44 26" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="20" r="2" fill="#38bdf8"/>
    </g>

    <text x="86" y="42" fill="url(#brand-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">AI ПРОРАБ</text>
    <text x="340" y="42" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500">v1.0.0 · PRODUCTION READY</text>

    <text x="86" y="72" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
      Автономный рой ассистентов технического заказчика для ремонта квартир
    </text>
    <text x="86" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Детерминированный Policy Guard · Контур агентов-скептиков СНиП РК · Расчёт объёмов материалов · Human-in-the-Loop
    </text>
  </g>

  <!-- 4 Feature Highlight Metric Cards -->
  <g transform="translate(60, 240)">
    <!-- Card 1: Risk Saved -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="255" height="110" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="18" y="28" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">ПРЕДОТВРАЩЁННЫЙ РИСК</text>
      <text x="18" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">5 250 000 ₸</text>
      <text x="18" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Блокировка демпинга и перегруза</text>
    </g>

    <!-- Card 2: Price Policy Guard -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="255" height="110" rx="14" fill="url(#card-grad)" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="1"/>
      <text x="18" y="28" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">POLICY GUARD ИНВАРИАНТ</text>
      <text x="18" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">0 Галлюцинаций</text>
      <text x="18" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Запрет ранней цены до 3D-обмера</text>
    </g>

    <!-- Card 3: Normative Adilet -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="255" height="110" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
      <text x="18" y="28" fill="#10b981" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">НОРМАТИВЫ КАЗАХСТАНА</text>
      <text x="18" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">СНиП · СП · ПУЭ РК</text>
      <text x="18" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Прямые ссылки на adilet.zan.kz</text>
    </g>

    <!-- Card 4: Human-in-the-Loop Gate -->
    <g transform="translate(825, 0)">
      <rect x="0" y="0" width="255" height="110" rx="14" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="18" y="28" fill="#818cf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">HUMAN-IN-THE-LOOP</text>
      <text x="18" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">Airgap Locked</text>
      <text x="18" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Тендер закрыт до подписи ТЗ</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Line -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      STACK: Next.js 14 · React 18 · TypeScript Strict · Tailwind CSS · Zod 3.23 · Vitest 2.1 · Lucide Icons
    </text>
    <text x="1080" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end" font-weight="600">
      github.com/vitaliy-demidov/ai-prorab
    </text>
  </g>
</svg>
