<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070A"/>
      <stop offset="50%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <radialGradient id="ogGoldGlow" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#AA820A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ogCyanGlow" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#006680" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC86A"/>
      <stop offset="40%" stop-color="#FFF5D6"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1E"/>
    </linearGradient>

    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.08"/>
      <circle cx="40" cy="0" r="1" fill="#D4AF37" fill-opacity="0.2"/>
    </pattern>

    <filter id="ogShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
  </style>

  <rect width="1280" height="640" fill="url(#ogBg)"/>
  <rect width="1280" height="640" fill="url(#ogGrid)"/>
  <circle cx="1080" cy="140" r="450" fill="url(#ogGoldGlow)"/>
  <circle cx="180" cy="520" r="380" fill="url(#ogCyanGlow)"/>

  <!-- Precision Corner Framing (80px safe zone) -->
  <g stroke="#ECC86A" stroke-width="1.5" stroke-opacity="0.45" fill="none">
    <path d="M 80 100 L 80 80 L 100 80" />
    <path d="M 1200 100 L 1200 80 L 1180 80" />
    <path d="M 80 540 L 80 560 L 100 560" />
    <path d="M 1200 540 L 1200 560 L 1180 560" />
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(80, 80)">
    <g class="font-mono" font-size="12" letter-spacing="2" fill="#8896A6">
      <text x="0" y="22" fill="#ECC86A" font-weight="700">HACKALEM 2026 // ASTANA</text>
      <text x="750" y="22">PROJECT: AI PRORAB</text>
      <text x="1120" y="22" text-anchor="end" fill="#00E5FF">● DETERMINISTIC AGENT</text>
    </g>
    <line x1="0" y1="36" x2="1120" y2="36" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- Main Hero Block -->
  <g transform="translate(80, 160)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="270" height="28" rx="6" fill="#141926" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="14" y="19" class="font-mono" font-size="11" font-weight="700" fill="#ECC86A" letter-spacing="1.5">CLUB 600 · INDUSTRY STANDARDS</text>

    <!-- Main Title -->
    <text x="0" y="80" class="font-sans" font-size="64" font-weight="800" fill="url(#goldText)" letter-spacing="-1.5">
      AI ПРОРАБ
    </text>
    <text x="440" y="80" class="font-sans" font-size="64" font-weight="300" fill="#FFFFFF" letter-spacing="-1">
      ENGINE
    </text>

    <!-- Tagline -->
    <text x="0" y="125" class="font-sans" font-size="22" font-weight="400" fill="#CBD5E1" letter-spacing="-0.2">
      Autonomous Technical Client Agent for Construction &amp; Fitout
    </text>
    
    <text x="0" y="156" class="font-sans" font-size="16" font-weight="400" fill="#8E9AA8">
      Zero Hallucinated Budgets · Hard Policy Invariants · Provable Fact Trace · Human-in-the-Loop
    </text>
  </g>

  <!-- 4-Card Industrial Grid (Bento Matrix) -->
  <g transform="translate(80, 375)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="265" height="140" rx="10" fill="#0E121C" stroke="#1F283C" stroke-width="1.2"/>
    <circle cx="36" cy="38" r="16" fill="#D4AF37" fill-opacity="0.15"/>
    <text x="36" y="44" text-anchor="middle" class="font-mono" font-size="16" fill="#ECC86A" font-weight="700">§</text>
    <text x="64" y="42" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">Fact Provenance</text>
    <text x="24" y="78" class="font-sans" font-size="13" fill="#8896A6">
      Extracts validated entities strictly from text; isolates critical unknowns.
    </text>
    <text x="24" y="118" class="font-mono" font-size="11" fill="#ECC86A">STATUS: VERIFIED</text>

    <!-- Card 2 -->
    <rect x="285" y="0" width="265" height="140" rx="10" fill="#0E121C" stroke="#1F283C" stroke-width="1.2"/>
    <circle cx="321" cy="38" r="16" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="321" y="44" text-anchor="middle" class="font-mono" font-size="16" fill="#00E5FF" font-weight="700">⚡</text>
    <text x="349" y="42" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">Policy Guard</text>
    <text x="309" y="78" class="font-sans" font-size="13" fill="#8896A6">
      Hard intercept on premature estimates before onsite instrumental survey.
    </text>
    <text x="309" y="118" class="font-mono" font-size="11" fill="#00E5FF">INVARIANTS: 7/7 PASS</text>

    <!-- Card 3 -->
    <rect x="570" y="0" width="265" height="140" rx="10" fill="#0E121C" stroke="#1F283C" stroke-width="1.2"/>
    <circle cx="606" cy="38" r="16" fill="#10B981" fill-opacity="0.15"/>
    <text x="606" y="44" text-anchor="middle" class="font-mono" font-size="16" fill="#10B981" font-weight="700">✓</text>
    <text x="634" y="42" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">Human In The Loop</text>
    <text x="594" y="78" class="font-sans" font-size="13" fill="#8896A6">
      External contractor dispatch locked until WorkBrief signature by client.
    </text>
    <text x="594" y="118" class="font-mono" font-size="11" fill="#10B981">DISPATCH: LOCKED</text>

    <!-- Card 4 -->
    <rect x="855" y="0" width="265" height="140" rx="10" fill="#0E121C" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="891" cy="38" r="16" fill="#ECC86A" fill-opacity="0.15"/>
    <text x="891" y="44" text-anchor="middle" class="font-mono" font-size="16" fill="#ECC86A" font-weight="700">∞</text>
    <text x="919" y="42" class="font-sans" font-size="16" font-weight="700" fill="#ECC86A">Audit Trail</text>
    <text x="879" y="78" class="font-sans" font-size="13" fill="#8896A6">
      Complete tool trace &amp; rationale logged for technical inspection &amp; jury review.
    </text>
    <text x="879" y="118" class="font-mono" font-size="11" fill="#ECC86A">LATENCY: &lt; 20 MS</text>
  </g>

  <!-- Bottom Brand Footprint -->
  <g transform="translate(80, 545)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#D4AF37" stroke-opacity="0.18" stroke-width="1"/>
    <g class="font-mono" font-size="10" fill="#64748B" letter-spacing="1.5">
      <text x="0" y="18">ENGINEERING STANDARD: CLUB 600 · OPEN ARCHITECTURE</text>
      <text x="1120" y="18" text-anchor="end">VERIFIABLE PRODUCTION RUNTIME</text>
    </g>
  </g>
</svg>